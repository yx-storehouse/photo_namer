name: photo_namer
description: "Photo naming app with presets."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.0+1
  path_provider: ^2.1.2
  path: ^1.9.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  image: ^4.2.0
  file_picker: ^8.0.7
  archive: ^3.6.1
  share_plus: ^10.1.4

  cupertino_icons: ^1.0.8
  device_info_plus: ^12.3.0
  android_intent_plus: ^6.0.0
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.2.1
  http: ^1.2.2
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "web/photo_namer.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "web/photo_namer.png"
